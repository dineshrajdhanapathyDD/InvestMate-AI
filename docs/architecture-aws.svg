<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1120" height="640" fill="#ffffff"/>
  <text x="560" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#232F3E">InvestMate AI - AWS Architecture (ap-south-1)</text>

  <!-- AWS Cloud boundary -->
  <rect x="150" y="60" width="930" height="500" rx="8" fill="none" stroke="#232F3E" stroke-width="2"/>
  <text x="170" y="84" font-size="13" font-weight="700" fill="#232F3E">AWS Cloud</text>

  <!-- User -->
  <g>
    <rect x="36" y="300" width="64" height="64" rx="8" fill="#232F3E"/>
    <circle cx="68" cy="322" r="11" fill="#fff"/>
    <path d="M50 352c0-12 36-12 36 0z" fill="#fff"/>
    <text x="68" y="382" text-anchor="middle" font-size="11" fill="#232F3E">Investor</text>
    <text x="68" y="396" text-anchor="middle" font-size="11" fill="#232F3E">(browser)</text>
  </g>

  <!-- CloudFront -->
  <g>
    <rect x="190" y="120" width="64" height="64" rx="8" fill="#8C4FFF"/>
    <text x="222" y="158" text-anchor="middle" font-size="26" fill="#fff">&#9729;</text>
    <text x="222" y="202" text-anchor="middle" font-size="11" font-weight="600" fill="#232F3E">CloudFront</text>
    <text x="222" y="216" text-anchor="middle" font-size="10" fill="#555">HTTPS / SPA</text>
  </g>

  <!-- S3 -->
  <g>
    <rect x="190" y="300" width="64" height="64" rx="8" fill="#277116"/>
    <text x="222" y="340" text-anchor="middle" font-size="24" fill="#fff">&#128230;</text>
    <text x="222" y="382" text-anchor="middle" font-size="11" font-weight="600" fill="#232F3E">Amazon S3</text>
    <text x="222" y="396" text-anchor="middle" font-size="10" fill="#555">private + OAC</text>
  </g>

  <!-- API Gateway -->
  <g>
    <rect x="400" y="120" width="64" height="64" rx="8" fill="#BC1356"/>
    <text x="432" y="160" text-anchor="middle" font-size="24" fill="#fff">&#8644;</text>
    <text x="432" y="202" text-anchor="middle" font-size="11" font-weight="600" fill="#232F3E">API Gateway</text>
    <text x="432" y="216" text-anchor="middle" font-size="10" fill="#555">REST /api/v1</text>
  </g>

  <!-- Lambda -->
  <g>
    <rect x="610" y="120" width="64" height="64" rx="8" fill="#D05C17"/>
    <text x="642" y="160" text-anchor="middle" font-size="26" fill="#fff">&#955;</text>
    <text x="642" y="202" text-anchor="middle" font-size="11" font-weight="600" fill="#232F3E">AWS Lambda</text>
    <text x="642" y="216" text-anchor="middle" font-size="10" fill="#555">agent orchestrator</text>
  </g>

  <!-- Bedrock -->
  <g>
    <rect x="860" y="120" width="64" height="64" rx="8" fill="#4D27AA"/>
    <text x="892" y="160" text-anchor="middle" font-size="24" fill="#fff">&#9672;</text>
    <text x="892" y="202" text-anchor="middle" font-size="11" font-weight="600" fill="#232F3E">Amazon Bedrock</text>
    <text x="892" y="216" text-anchor="middle" font-size="10" fill="#555">Nova Lite (apac)</text>
  </g>

  <!-- CloudWatch -->
  <g>
    <rect x="610" y="320" width="64" height="64" rx="8" fill="#BC1356"/>
    <text x="642" y="360" text-anchor="middle" font-size="22" fill="#fff">&#128200;</text>
    <text x="642" y="402" text-anchor="middle" font-size="11" font-weight="600" fill="#232F3E">CloudWatch</text>
    <text x="642" y="416" text-anchor="middle" font-size="10" fill="#555">logs + metrics</text>
  </g>

  <!-- DynamoDB -->
  <g>
    <rect x="860" y="320" width="64" height="64" rx="8" fill="#3334B9"/>
    <text x="892" y="360" text-anchor="middle" font-size="24" fill="#fff">&#128451;</text>
    <text x="892" y="402" text-anchor="middle" font-size="11" font-weight="600" fill="#232F3E">DynamoDB</text>
    <text x="892" y="416" text-anchor="middle" font-size="10" fill="#555">watchlist/prefs</text>
  </g>

  <!-- IAM -->
  <g>
    <rect x="610" y="470" width="64" height="64" rx="8" fill="#C7131F"/>
    <text x="642" y="510" text-anchor="middle" font-size="24" fill="#fff">&#128273;</text>
    <text x="642" y="552" text-anchor="middle" font-size="11" font-weight="600" fill="#232F3E">AWS IAM</text>
    <text x="642" y="566" text-anchor="middle" font-size="10" fill="#555">least privilege</text>
  </g>

  <!-- NSE MCP external -->
  <g>
    <rect x="905" y="470" width="180" height="76" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="995" y="494" text-anchor="middle" font-size="11" font-weight="700" fill="#7F1D1D">NSE MCP endpoints</text>
    <text x="995" y="510" text-anchor="middle" font-size="10" fill="#7F1D1D">streamable-http</text>
    <text x="995" y="526" text-anchor="middle" font-size="10" fill="#7F1D1D">BLOCKED by Akamai</text>
    <text x="995" y="540" text-anchor="middle" font-size="10" fill="#7F1D1D">(504 to headless)</text>
  </g>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#555"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#DC2626"/></marker>
  </defs>
  <g stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M100 332 L186 180"/>
    <path d="M222 186 L222 298"/>
    <path d="M256 160 L396 155"/>
    <path d="M466 155 L606 155"/>
    <path d="M676 160 L856 155"/>
    <path d="M660 186 L645 318"/>
    <path d="M680 170 L858 330"/>
    <path d="M642 186 L642 468" stroke-dasharray="5 4"/>
  </g>
  <path d="M676 165 L905 500" stroke="#DC2626" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#arrR)"/>

  <g font-size="10" fill="#444">
    <text x="150" y="250">HTTPS</text>
    <text x="150" y="285">serves app</text>
    <text x="300" y="145">/api/v1 CORS</text>
    <text x="520" y="145">Lambda proxy</text>
    <text x="700" y="145">Converse tool-use</text>
    <text x="700" y="260">watch/prefs</text>
    <text x="560" y="260">logs</text>
    <text x="560" y="430">assumes</text>
    <text x="760" y="330" fill="#DC2626">try live -> 504, fall back to labelled sample</text>
  </g>

  <text x="150" y="600" font-size="11" fill="#475569">Solid = working path.  Dashed red = verified-unreachable live NSE path (Akamai); app falls back to clearly labelled sample data.</text>
</svg>
